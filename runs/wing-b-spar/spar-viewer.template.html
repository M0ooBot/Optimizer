<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wing B · Spar clearance</title>
<style>
:root { color-scheme: light; font-family: system-ui, sans-serif; color: #233749; background: #edf2f6; }
* { box-sizing: border-box; }
body { margin: 0; }
header, main { max-width: 1640px; margin: auto; padding-inline: clamp(14px, 3.5vw, 46px); }
header { padding-block: 26px 16px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(25px, 4vw, 34px); letter-spacing: -.04em; }
h2 { font-size: 17px; }
p { font-size: 13px; color: #465d70; line-height: 1.5; }
main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; padding-bottom: 24px; }
section { min-width: 0; overflow: hidden; border: 1px solid #d4e0e8; border-radius: 10px; background: white; }
.panel-head { display: grid; gap: 9px; padding: 15px 15px 0; }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.controls label { font-size: 12px; }
button { color: #2c4255; background: white; border: 1px solid #c2d2de; border-radius: 5px;
         font: inherit; font-size: 12px; cursor: pointer; padding: 6px 9px; }
button:hover { border-color: #526c83; }
button:focus-visible { outline: 2px solid #156290; outline-offset: 2px; }
button[aria-pressed="true"] { background: #e7eff5; color: #18374f; border-color: #829bae; }
.wing-layer { color: var(--ink); }
.wing-layer[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.viewport { height: clamp(320px, 52vh, 640px); }
.viewport > div { height: 100%; }
.panel-foot { padding: 0 15px 14px; }
#readout { min-height: 40px; font-variant-numeric: tabular-nums; color: #304b5d; }
@media (max-width: 850px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .viewport { height: clamp(285px, 80vw, 450px); }
}
@media (pointer: coarse) { button { min-height: 42px; } }
</style>
</head>
<body>
<header>
  <h1>Wing B · Spar clearance</h1>
  <p>Ø6.4 mm channel · ≥1.0 mm exterior wall</p>
</header>
<main>
  <section aria-labelledby="wing-title">
    <div class="panel-head">
      <h2 id="wing-title">Wing and spar</h2>
      <div class="controls" id="scenarios" aria-label="Measured print settings"></div>
      <div class="controls" id="wings" aria-label="Wing geometry layers"></div>
      <div class="controls" id="layers" aria-label="Geometry layers">
        <button data-layer="channel" aria-pressed="true">Channel</button>
        <button data-layer="axis" aria-pressed="true">Axis</button>
        <button data-layer="planes" aria-pressed="true">Print cuts</button>
        <button data-layer="wall" aria-pressed="true">Minimum wall marker</button>
        <button data-layer="reach" aria-pressed="true">Tip engagement markers</button>
      </div>
      <nav class="controls" id="cameras" aria-label="Camera presets"></nav>
    </div>
    <div class="viewport" role="region" aria-label="Equal-scale orthographic 3D wing">{{WING}}</div>
    <p class="panel-foot">Amber marks the axis from tip joint to channel end. Magenta joins channel and skin.</p>
  </section>
  <section aria-labelledby="section-title">
    <div class="panel-head">
      <h2 id="section-title">Print joint section</h2>
      <div class="controls" id="results" aria-label="Inspected spar"></div>
      <nav class="controls" id="sections" aria-label="Print cut stations"></nav>
      <div class="controls" id="section-zoom" aria-label="Section scale">
        <button data-zoom="channel" aria-pressed="true">Channel close-up</button>
        <button data-zoom="full" aria-pressed="false">Full section</button>
      </div>
      <p id="readout" aria-live="polite"></p>
      <p id="reach-readout"></p>
    </div>
    <div class="viewport" role="region" aria-label="Equal-scale CAD section at the selected print cut">{{SECTION}}</div>
    <p class="panel-foot">The section shows the oblique intersection of the channel and the selected print cut.</p>
  </section>
</main>
<script>
const {scenarios, cameras, wholeView, planes} = {{DATA}};
const wing = document.getElementById("wing-view");
const section = document.getElementById("section-view");
const readout = document.getElementById("readout");
const reachReadout = document.getElementById("reach-readout");
const layers = {channel: true, axis: true, planes: true, wall: true, reach: true};
const visibleWings = {};
let {records, cuts, reachView} = scenarios[0];
let inspected = preferredVariant();
let cut = cuts.at(-1);
let zoom = "channel";
let camera = "Tip reach";

function button(parent, label, pressed, callback) {
  const element = document.createElement("button");
  element.textContent = label;
  element.setAttribute("aria-pressed", String(pressed));
  element.addEventListener("click", callback);
  document.getElementById(parent).append(element);
  return element;
}

function mark(buttons, selectedIndex) {
  buttons.forEach((item, index) => item.setAttribute("aria-pressed", String(index === selectedIndex)));
}

function preferredVariant() {
  const passing = records.findIndex(record => record.passGeometry);
  return passing < 0 ? records.length - 1 : passing;
}

function updateWing() {
  const flags = wing.data.map(() => false);
  const opacity = wing.data.map(trace => trace.opacity ?? 1);
  records.forEach((record, index) => {
    flags[record.wing] = flags[record.wing + 1] = visibleWings[record.variant] ?? true;
    opacity[record.wing] = camera === "Minimum wall" ? .13 : .28;
    if (index === inspected) {
      flags[record.channel] = layers.channel;
      opacity[record.channel] = camera === "Tip reach" && layers.reach ? .34 : .78;
      flags[record.channel + 1] = layers.channel;
      flags[record.channel + 2] = layers.axis;
      flags[record.channel + 3] = layers.wall;
      flags[record.channel + 4] = layers.reach;
    }
  });
  cuts.forEach(span => {
    flags[planes[span]] = flags[planes[span] + 1] = layers.planes;
  });
  Plotly.restyle(wing, {visible: flags, opacity});
}

function updateCamera() {
  const area = camera === "Minimum wall" ? records[inspected].wallView
    : camera === "Tip reach" ? reachView : wholeView;
  Plotly.relayout(wing, {scene: {...area, dragmode: "orbit", camera: cameras[camera]}});
}

function updateSection() {
  const record = records[inspected];
  const flags = section.data.map(() => false);
  records.forEach((item, i) => {
    const start = item.cuts[cut].trace;
    flags[start] = visibleWings[item.variant] ?? true;
    flags[start + 1] = i === inspected && layers.channel;
    flags[start + 2] = i === inspected && layers.axis;
  });
  const spanViews = records.map(item => item.cuts[cut]);
  const {center} = record.cuts[cut];
  const ranges = zoom === "channel"
    ? center.map(position => [position - 11, position + 11])
    : center.map((position, i) => [
        Math.min(position, ...spanViews.map(view => view.low[i])) - 5,
        Math.max(position, ...spanViews.map(view => view.high[i])) + 5,
      ]);
  Plotly.restyle(section, {visible: flags});
  Plotly.relayout(section, {"xaxis.range": ranges[0], "yaxis.range": ranges[1]});
  const resultLabel = record.passGeometry ? "Pass" : "Best tested axis · Fails clearance";
  const measurement = record.wall < 0
    ? `Skin breach ${Math.abs(record.wall).toFixed(3)} mm`
    : `Minimum wall ${record.wall.toFixed(3)} mm`;
  const outcome = `${resultLabel} · ${measurement}`;
  readout.textContent = `${outcome} at ${record.wallSpan.toFixed(1)} mm outboard · ${record.engagement.toFixed(1)} mm minimum full-diameter engagement`;
  const [[joint], [end]] = record.reach;
  reachReadout.textContent = `Tip joint at ${joint.toFixed(1)} mm · Channel centerline ends at ${end.toFixed(1)} mm outboard`;
}

function renderScenarioControls() {
  ["wings", "results", "sections"].forEach(id => document.getElementById(id).replaceChildren());
  records.forEach(record => {
    const shown = visibleWings[record.variant] ?? true;
    const layer = button("wings", record.variant, shown, () => {
      visibleWings[record.variant] = !(visibleWings[record.variant] ?? true);
      layer.setAttribute("aria-pressed", String(visibleWings[record.variant]));
      updateWing();
      updateSection();
    });
    layer.classList.add("wing-layer");
    layer.style.setProperty("--ink", record.color);
  });
  const resultButtons = records.map((record, index) => button(
    "results", record.variant + (index === preferredVariant() && record.passGeometry ? " · Selected" : ""),
    index === inspected, () => {
      inspected = index;
      mark(resultButtons, index);
      updateWing();
      updateSection();
      if (camera === "Minimum wall") updateCamera();
    },
  ));
  const cutButtons = cuts.map((station, index) => button(
    "sections", `${station} mm outboard`, station === cut, () => {
      cut = station;
      mark(cutButtons, index);
      updateSection();
    },
  ));
}
const scenarioButtons = scenarios.map((scenario, index) => button(
  "scenarios", `${scenario.tip} mm tip · ≥${scenario.engagement} mm engagement · ${scenario.height} mm print limit`,
  index === 0, () => {
    mark(scenarioButtons, index);
    ({records, cuts, reachView} = scenario);
    inspected = preferredVariant();
    cut = cuts.at(-1);
    renderScenarioControls();
    updateWing();
    updateSection();
    if (camera === "Minimum wall" || camera === "Tip reach") updateCamera();
  },
));
const cameraButtons = Object.keys(cameras).map((preset, index) => button(
  "cameras", preset, preset === camera, () => {
    camera = preset;
    mark(cameraButtons, index);
    updateCamera();
    updateWing();
  },
));
document.querySelectorAll("[data-layer]").forEach(item => item.addEventListener("click", () => {
  const id = item.dataset.layer;
  layers[id] = !layers[id];
  item.setAttribute("aria-pressed", String(layers[id]));
  updateWing();
  updateSection();
}));
const zoomButtons = [...document.querySelectorAll("[data-zoom]")];
zoomButtons.forEach((item, index) => item.addEventListener("click", () => {
  zoom = item.dataset.zoom;
  mark(zoomButtons, index);
  updateSection();
}));
renderScenarioControls();
updateWing();
updateSection();
</script>
</body>
</html>
